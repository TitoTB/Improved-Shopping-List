name: Mercadona complete index live diagnostic
on:
  push:
    branches: [codex/eci-http-probe]
permissions:
  contents: read
jobs:
  public-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check actual integration HTTP helper and parser in HA Core
        run: docker run --rm --entrypoint python -v "$PWD:/work:ro" -w /work ghcr.io/home-assistant/home-assistant:2026.10.2 scripts/probe-mercadona.py --index-only
