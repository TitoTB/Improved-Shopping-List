name: ECI HTTP diagnostic
on:
  push:
    branches: [codex/eci-http-probe]
permissions:
  contents: read
jobs:
  public-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test ordinary anonymous session
        run: |
          python - <<'PY'
          import json,time
          from http.cookiejar import CookieJar
          from urllib.request import Request,build_opener,HTTPCookieProcessor,HTTPRedirectHandler
          from urllib.error import HTTPError
          BASE='https://www.elcorteingles.es'
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          jar=CookieJar();opener=build_opener(NoRedirect(),HTTPCookieProcessor(jar))
          headers={'Accept':'application/json, text/plain, */*','response_type':'json','Accept-Language':'es-ES,es;q=0.9','User-Agent':'Mozilla/5.0','Referer':BASE+'/supermercado/'}
          urls=[BASE+'/supermercado/',BASE+'/supermercado/buscar/?question=8431876332216&catalog=supermercado&stype=text_box',BASE+'/supermercado/buscar/?question=8410199023094&catalog=supermercado&stype=text_box']
          for i,url in enumerate(urls):
              if i:time.sleep(20)
              request=Request(url,headers={**headers,**({'Accept':'text/html'} if i==0 else {})})
              try:r=opener.open(request,timeout=25)
              except HTTPError as e:r=e
              with r:
                  body=r.read(2097153);result={'stage':['homepage','no_result','known_ean'][i],'status':r.status,'type':r.headers.get('Content-Type'),'cookies':len(jar)}
              if r.status==200 and i:
                  data=json.loads(body);result['products']=[{'id':p.get('id'),'url':p.get('url')} for p in data.get('products',[]) if isinstance(p,dict) and str(p.get('id','')).startswith('B')]
              print(json.dumps(result),flush=True)
              if r.status!=200:break
          PY
