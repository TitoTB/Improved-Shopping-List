name: Mercadona public catalog diagnostic
on:
  push:
    branches: [codex/eci-http-probe]
permissions:
  contents: read
jobs:
  public-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public catalog using official Home Assistant runtime
        run: docker run --rm --entrypoint python -v "$PWD:/work:ro" -w /work ghcr.io/home-assistant/home-assistant:2026.10.2 scripts/mercadona-public-probe.py
