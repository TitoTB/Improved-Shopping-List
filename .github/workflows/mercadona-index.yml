name: Mercadona public EAN index
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-mercadona-index.py', '.github/workflows/mercadona-index.yml']
permissions:
  contents: write
concurrency:
  group: community-dictionary
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build index from public product responses
        shell: bash
        run: |
          git clone --depth 1 https://huggingface.co/datasets/datania/mercadona-catalog "$RUNNER_TEMP/mercadona-source"
          REVISION=$(git -C "$RUNNER_TEMP/mercadona-source" rev-parse HEAD)
          UPDATED=$(git -C "$RUNNER_TEMP/mercadona-source" show -s --format=%cI HEAD)
          python scripts/build-mercadona-index.py "$RUNNER_TEMP/mercadona-source" "$RUNNER_TEMP/mercadona-index.json" --revision "$REVISION" --updated-at "$UPDATED"
      - name: Publish compact index without changing integration code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/mercadona-publish"
          cd "$RUNNER_TEMP/mercadona-publish"
          git init
          git remote add origin "https://github.com/${GH_REPO}.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          if git -c http.extraheader="AUTHORIZATION: basic $AUTH" ls-remote --exit-code origin refs/heads/data >/dev/null; then
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --depth=1 origin data
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
          fi
          mkdir -p catalogs
          cp "$RUNNER_TEMP/mercadona-index.json" catalogs/mercadona-index.json
          git add catalogs/mercadona-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Mercadona public EAN index'
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:data
